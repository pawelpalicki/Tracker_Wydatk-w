<!-- Nowy projekt ikony - Wersja 5 (Smart Chart + AI Magic) -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ciemne tło -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  
  <!-- Słupki wydatków (Zróżnicowane wysokości i odcienie) -->
  <rect x="140" y="270" width="45" height="90" rx="12" fill="#38BDF8" fill-opacity="0.3"/>
  <rect x="215" y="210" width="45" height="150" rx="12" fill="#38BDF8" fill-opacity="0.6"/>
  <rect x="290" y="150" width="45" height="210" rx="12" fill="url(#paint0_linear)"/>
  
  <!-- Linia Limitowa (Glow) -->
  <rect x="120" y="195" width="280" height="7" rx="3.5" fill="white">
     <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Iskry AI (Styl "Magic") -->
  <!-- Główna Iskra -->
  <path d="M380 130C380 130 380 155 405 155C380 155 380 180 380 180C380 180 380 155 355 155C380 155 380 130 380 130Z" fill="white">
     <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Mała Iskra -->
  <path d="M415 105C415 105 415 120 430 120C415 120 415 135 415 135C415 135 415 120 400 120C415 120 415 105 415 105Z" fill="#38BDF8">
     <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </path>

  <defs>
    <linearGradient id="paint0_linear" x1="290" y1="150" x2="335" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
</svg>
